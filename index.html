<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>SaúdeSPX</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="componentes/credito/credito.css">
</head>
<body>
  <header class="topo">
    <div class="topo-interno">
      <a class="topo-marca" href="#/">SaúdeSPX</a>
      <nav id="topo-nav" class="topo-nav oculto" aria-label="Principal">
        <a href="#/" data-rota="busca">Buscar</a>
        <a href="#/novo" data-rota="novo" data-minimo="edicao">Novo colaborador</a>
        <a href="#/acessos" data-rota="acessos" data-minimo="responsavel">Acessos <span id="selo-pedidos" class="selo oculto"></span></a>
      </nav>
      <div id="topo-usuario" class="topo-usuario oculto">
        <span id="topo-email" class="topo-email"></span>
        <button id="topo-sair" class="topo-sair" type="button">Sair</button>
      </div>
    </div>
  </header>

  <div id="aviso-pedidos" class="aviso-pedidos-fundo oculto" role="status">
    <div class="aviso-pedidos">
      <span id="aviso-pedidos-texto"></span>
      <a class="botao" href="#/acessos">Ver pedidos</a>
    </div>
  </div>

  <main id="app" class="conteudo"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="componentes/credito/credito.js"></script>
  <script src="js/config/supabase.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/niveis.js"></script>
  <script src="js/core/cpf.js"></script>
  <script src="js/core/colaborador.js"></script>
  <script src="js/data/cliente.js"></script>
  <script src="js/data/acesso.js"></script>
  <script src="js/data/local.js"></script>
  <script src="js/ui/ui.js"></script>
  <script src="js/screens/login.js"></script>
  <script src="js/screens/pedido.js"></script>
  <script src="js/screens/acessos.js"></script>
  <script src="js/screens/busca.js"></script>
  <script src="js/screens/atendimento.js"></script>
  <script src="js/screens/ficha.js"></script>
  <script src="js/screens/cadastro.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
